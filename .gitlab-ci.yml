# ═══════════════════════════════════════════
# STAGE — visual (Percy visual regression testing)
# Requires PERCY_TOKEN set as a masked/protected CI/CD variable in
# GitLab (Settings > CI/CD > Variables) — never commit the token itself.
# ═══════════════════════════════════════════
job-visual-testing:
  <<: *playwright_template
  stage: visual
  allow_failure: true
  # needs:
  #   - job: job-setup-env
  #     artifacts: true
  script:
    - echo $CI_JOB_ID >> reports_job_id_visual.txt
    - ENV=$TEST_ENVIRONMENT npx percy exec -- npx playwright test --project=chromium-account -g "@visual" --workers=1
  after_script:
    - echo $CI_JOB_STATUS >> status_job_id_visual.txt
  artifacts:
    when: always
    paths:
      - playwright-report
      - reports_job_id_visual.txt
      - status_job_id_visual.txt

