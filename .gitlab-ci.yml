weekly_slack_notification:
  stage: locker
  image: alpine:latest
  rules:
    - if: '$TEST_STAGE == "looker"'
      when: on_success
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - |
      SLACK_WEBHOOK_BASEURL=${SLACK_WEBHOOK_BASEURL:-}
      SLACK_WEBHOOK_TOKEN_DEVELOP=${SLACK_WEBHOOK_TOKEN_DEVELOP:-}
      SLACK_WEBHOOK_TOKEN_PREPROD=${SLACK_WEBHOOK_TOKEN_PREPROD:-}

      if [ "$TEST_ENVIRONMENT" = "develop" ]; then
        SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_BASEURL$SLACK_WEBHOOK_TOKEN_DEVELOP"
      elif [ "$TEST_ENVIRONMENT" = "pre-prod" ]; then
        SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_BASEURL$SLACK_WEBHOOK_TOKEN_PREPROD"
      fi

      CURRENT_DATE=$(date +"%Y-%m-%d")

      cat > payload.json <<EOF
      {
        "text": "✨ Nouveau rapport de suivi disponible ✨\n\n> Vous pouvez consulter le rapport de suivi du projet automatisation JEL \n> 🌟 *Merci de votre attention* 🌟",
        "blocks": [
          { "type": "divider" },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "✨ *Nouveau rapport de suivi disponible* ✨"
            }
          },
          { "type": "divider" },
          {
          "type": "section",
          "text": {
              "type": "mrkdwn",
              "text": "📊 Voici le rapport de suivi.\n ✨ Consultez les détails pour obtenir les informations sur le projet d'automatisation JEL. ✨ "
          },
          "accessory": {
              "type": "button",
              "text": {
              "type": "plain_text",
              "text": "Click Me",
              "emoji": true
              },
              "value": "click_me_123",
              "url": "https://lookerstudio.google.com/s/pAK_DlXO6hw",
              "action_id": "button-action"
          }
          }
        ]
      }
      EOF

      echo "Sending weekly notification to Slack..."
      curl -X POST -H "Content-Type: application/json" \
           --data @payload.json \
           $SLACK_WEBHOOK_URL
  when: always
  allow_failure: true
