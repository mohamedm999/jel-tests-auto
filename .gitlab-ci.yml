default:
  tags:
    - glb-devops-gitlab-runner
  interruptible: true

stages:
  # - setupEnv
  # - test
  - visual
  # - notify
  # - report
  - locker

variables:
  TEST_ENVIRONMENT: "develop"
  SLACK_WEBHOOK_URL: "$SLACK_WEBHOOK_URL"
  SLACK_WEBHOOK_ACCOUNT_URL_DEVELOP: "$SLACK_WEBHOOK_ACCOUNT_URL_DEVELOP"
  SLACK_WEBHOOK_ACCOUNT_URL_PREPROD: "$SLACK_WEBHOOK_ACCOUNT_URL_PREPROD"

.playwright_template: &playwright_template
  image: mcr.microsoft.com/playwright:v1.51.1-jammy
  before_script:
    - apt-get update && apt-get install -y jq
    - npm install
    - npx playwright install
  artifacts:
    paths:
      - playwright-report/
    when: always

